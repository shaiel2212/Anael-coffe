version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cafe_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cafe_management}
      MYSQL_USER: ${MYSQL_USER:-cafe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cafe_password}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cafe_network

  redis:
    image: redis:7-alpine
    container_name: cafe_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - cafe_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-cafe_management}
      DB_USER: ${MYSQL_USER:-cafe_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-cafe_password}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretrefreshjwtkey}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - '5000:5000'
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - cafe_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - cafe_network

volumes:
  mysql_data:

networks:
  cafe_network:
    driver: bridge
